<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS Studio Pro - Real Fix</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        html, body { overflow-y: auto !important; height: auto !important; min-height: 100vh; }
        .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .ios-dock { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(30px); border: 1px solid rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body class="bg-[#030712] text-slate-100 font-sans antialiased text-[10px]">

    <nav class="border-b border-white/5 bg-slate-950/80 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-3 py-1 flex justify-between items-center">
            <div class="flex items-center gap-1">
                <div class="w-4 h-4 bg-blue-600 rounded flex items-center justify-center animate-pulse">
                    <i data-lucide="sparkles" class="text-white w-2.5 h-2.5"></i>
                </div>
                <div>
                    <span class="font-bold text-[10px] block text-white">iOS Studio v2</span>
                    <span class="text-[6px] text-emerald-400 font-mono block tracking-widest">LIVE APPS & DIRECT DOWNLOAD</span>
                </div>
            </div>
            <div class="flex bg-slate-900 p-0.5 rounded border border-white/5">
                <button onclick="switchTab('maker')" id="btn-maker" class="px-2 py-0.5 rounded bg-blue-600 font-bold text-[8px] text-white cursor-pointer">Editor</button>
                <button onclick="switchTab('community')" id="btn-community" class="px-2 py-0.5 rounded font-bold text-[8px] text-slate-400 hover:text-white cursor-pointer">Moje Úložiště (<span id="global-counter">0</span>)</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-2 py-2">
        
        <div id="tab-maker" class="grid grid-cols-1 lg:grid-cols-12 gap-2 items-start">
            
            <div class="lg:col-span-4 glass-panel rounded-lg p-2 space-y-2.5 shadow-xl">
                
                <div class="bg-gradient-to-r from-blue-950/40 to-slate-900/60 p-1.5 rounded border border-blue-500/30">
                    <label class="block text-[7px] font-bold uppercase tracking-widest text-blue-400 mb-0.5">App Store Synchronizace</label>
                    <div class="flex gap-1">
                        <input type="text" id="appSearchInput" placeholder="Zadej Instagram, Spotify, TikTok, Pinterest..." class="w-full h-5 bg-slate-900 border border-white/10 rounded px-1 text-[9px] text-slate-200 placeholder:text-slate-600 focus:outline-none focus:border-blue-500">
                        <button onclick="searchAppStore()" class="bg-blue-600 hover:bg-blue-500 text-white px-2 rounded font-bold text-[8px] cursor-pointer shrink-0">Hledat</button>
                    </div>
                </div>

                <div>
                    <label class="block text-[7px] font-bold uppercase tracking-widest text-slate-400 mb-0.5">Formát Prvku</label>
                    <div class="grid grid-cols-3 gap-0.5">
                        <button onclick="setAssetType('icon')" id="type-icon" class="py-0.5 rounded border border-blue-500 bg-blue-500/10 text-[8px] font-bold text-white cursor-pointer">App Ikona</button>
                        <button onclick="setAssetType('widget-s')" id="type-widget-s" class="py-0.5 rounded border border-white/10 bg-slate-950/40 text-[8px] font-bold text-slate-400 hover:text-white cursor-pointer">Malý Widget</button>
                        <button onclick="setAssetType('widget-m')" id="type-widget-m" class="py-0.5 rounded border border-white/10 bg-slate-950/40 text-[8px] font-bold text-slate-400 hover:text-white cursor-pointer">Střední Widget</button>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-1">
                    <div>
                        <label class="block text-[7px] font-bold uppercase tracking-widest text-slate-400 mb-0.5">Barva Pozadí</label>
                        <input type="color" id="bgColor" value="#1e1e2e" oninput="updatePreview()" class="w-full h-5 rounded border border-white/20 bg-transparent cursor-pointer p-0">
                    </div>
                    <div>
                        <label class="block text-[7px] font-bold uppercase tracking-widest text-slate-400 mb-0.5">Barva Symbolu</label>
                        <input type="color" id="iconColor" value="#cdd6f4" oninput="updatePreview()" class="w-full h-5 rounded border border-white/20 bg-transparent cursor-pointer p-0">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-1">
                    <div>
                        <label class="block text-[7px] font-bold uppercase tracking-widest text-slate-400 mb-0.5">Ikona / Symbol</label>
                        <select id="iconSelect" onchange="updatePreview()" class="w-full h-5 bg-slate-950 border border-white/10 rounded px-0.5 text-[8px] font-bold text-slate-200">
                            <option value="heart">Zdraví / Srdce</option>
                            <option value="music">Hudba / Přehrávač</option>
                            <option value="camera">Instagram / Fotoaparát</option>
                            <option value="message-square">Zprávy / Chat</option>
                            <option value="compass">Safari / Prohlížeč</option>
                            <option value="wallet">Peněženka / Karty</option>
                            <option value="cloud-sun">Počasí / Meteoradar</option>
                            <option value="terminal">Kód / Vývojář</option>
                            <option value="bell">Notifikace / Zvonění</option>
                            <option value="layers">Aplikace / Knihovna</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[7px] font-bold uppercase tracking-widest text-slate-400 mb-0.5">Název na ploše</label>
                        <input type="text" id="assetLabel" value="App" oninput="updatePreview()" class="w-full h-5 bg-slate-950 border border-white/10 rounded px-1 text-[8px] text-slate-200">
                    </div>
                </div>

                <div>
                    <label class="block text-[7px] font-bold uppercase tracking-widest text-slate-400 mb-0.5">Text ve Widgetu (např. hodnota)</label>
                    <input type="text" id="elementText" placeholder="Např. 21°C nebo 12,5k" oninput="updatePreview()" class="w-full h-5 bg-slate-950 border border-white/10 rounded px-1 text-[8px] text-slate-200">
                </div>

                <div class="h-[1px] bg-white/5"></div>

                <div class="space-y-1">
                    <button id="btn-save" onclick="saveToRegistry()" class="w-full bg-slate-800 hover:bg-slate-700 border border-white/10 text-white font-bold py-1 rounded text-[8px] flex items-center justify-center gap-1 transition-all cursor-pointer">
                        <i data-lucide="save" class="w-2.5 h-2.5"></i> Uložit do paměti webu
                    </button>
                    
                    <button id="smart-action-btn" onclick="executeSmartAction()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold py-1.5 rounded text-[9px] flex items-center justify-center gap-1 shadow-md transition-all cursor-pointer">
                        <i id="smart-btn-icon" data-lucide="download" class="w-3 h-3"></i> <span id="smart-btn-text">Stáhnout jako .PNG</span>
                    </button>
                </div>
            </div>

            <div class="lg:col-span-8 flex flex-col items-center justify-center p-1">
                <div class="w-[210px] h-[400px] rounded-[32px] p-2 relative shadow-2xl border-[4px] border-slate-900 bg-slate-950 overflow-hidden select-none">
                    <div class="absolute inset-0 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=600&auto=format&fit=crop');"></div>
                    
                    <div class="w-14 h-3 bg-black rounded-full mx-auto mb-3 relative z-30"></div>

                    <div class="grid grid-cols-4 gap-2 p-1 relative z-10" id="ios-grid">
                        <div class="flex flex-col items-center opacity-20"><div class="w-8 h-8 bg-black rounded-lg flex items-center justify-center"><i data-lucide="phone" class="w-3 h-3 text-emerald-400"></i></div></div>
                        <div class="flex flex-col items-center opacity-20"><div class="w-8 h-8 bg-black rounded-lg flex items-center justify-center"><i data-lucide="mail" class="w-3 h-3 text-blue-400"></i></div></div>

                        <div id="preview-container" class="col-span-1 row-span-1 flex flex-col items-center justify-start">
                            <div id="ios-element" class="w-8 h-8 rounded-lg shadow-lg flex flex-col items-center justify-center relative overflow-hidden transition-all">
                                <div class="relative z-10 flex flex-col items-center justify-center w-full h-full p-0.5">
                                    <i id="preview-icon" data-lucide="heart" class="w-4 h-4"></i>
                                    <span id="preview-text" class="text-[4px] font-bold mt-0.5 hidden max-w-full truncate"></span>
                                </div>
                            </div>
                            <span id="element-label" class="text-[6px] text-white/90 font-medium mt-0.5 truncate max-w-[32px] drop-shadow-md">App</span>
                        </div>

                        <div class="flex flex-col items-center opacity-20"><div class="w-8 h-8 bg-black rounded-lg flex items-center justify-center"><i data-lucide="settings" class="w-3 h-3 text-slate-400"></i></div></div>
                    </div>

                    <div class="absolute bottom-2 left-2 right-2 h-8 ios-dock rounded-[14px] flex items-center justify-around px-2 shadow-lg">
                        <div class="w-5 h-5 bg-white/20 rounded-md flex items-center justify-center"><i data-lucide="message-circle" class="w-2.5 h-2.5 text-white"></i></div>
                        <div class="w-5 h-5 bg-white/20 rounded-md flex items-center justify-center"><i data-lucide="compass" class="w-2.5 h-2.5 text-white"></i></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="tab-community" class="hidden space-y-2">
            <div class="flex justify-between items-center bg-slate-900/80 p-2 border border-white/5 rounded-lg">
                <h2 class="text-[8px] font-bold text-white uppercase tracking-wider">Uložené ikony v paměti vašeho prohlížeče</h2>
                <button onclick="clearRegistryFully()" class="bg-rose-950/40 hover:bg-rose-900/60 border border-rose-500/30 text-rose-400 py-0.5 px-1.5 rounded text-[7px] cursor-pointer transition-all">Vymazat paměť</button>
            </div>
            <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-1.5" id="community-grid"></div>
        </div>
    </main>

    <canvas id="exportCanvas" style="display:none;"></canvas>

    <script>
        let currentAssetType = 'icon';
        
        // Rozsáhlá App Store databáze aplikací
        const appStoreDatabase = {
            'spotify': { label: 'Spotify', bg: '#1db954', iconColor: '#ffffff', icon: 'music' },
            'instagram': { label: 'Instagram', bg: '#e1306c', iconColor: '#ffffff', icon: 'camera' },
            'netflix': { label: 'Netflix', bg: '#e50914', iconColor: '#ffffff', icon: 'terminal' },
            'youtube': { label: 'YouTube', bg: '#ff0000', iconColor: '#ffffff', icon: 'music' },
            'pinterest': { label: 'Pinterest', bg: '#bd081c', iconColor: '#ffffff', icon: 'layers' },
            'tiktok': { label: 'TikTok', bg: '#000000', iconColor: '#00f2fe', icon: 'music' },
            'safari': { label: 'Safari', bg: '#1077e5', iconColor: '#ffffff', icon: 'compass' },
            'wallet': { label: 'Wallet', bg: '#1e1e1e', iconColor: '#ff9500', icon: 'wallet' },
            'health': { label: 'Zdraví', bg: '#ff2d55', iconColor: '#ffffff', icon: 'heart' },
            'messages': { label: 'Zprávy', bg: '#34c759', iconColor: '#ffffff', icon: 'message-square' },
            'messenger': { label: 'Messenger', bg: '#006aff', iconColor: '#ffffff', icon: 'message-square' }
        };

        // Lucide ikony mapované na SVG cesty pro čistý Canvas export bez externích knihoven
        const canvasPathMap = {
            'heart': 'M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z',
            'music': 'M9 18V5l12-2v13M9 10l12-2M7 22a3 3 0 1 1 0-6 3 3 0 0 1 0 6Zm12-2a3 3 0 1 1 0-6 3 3 0 0 1 0 6Z',
            'camera': 'M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z M12 17a4 4 0 1 1 0-8 4 4 0 0 1 0 8Z',
            'message-square': 'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z',
            'compass': 'M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10zm0-13l1.5 4.5L18 12l-4.5 1.5L12 18l-1.5-4.5L6 12l4.5-1.5L12 9z',
            'wallet': 'M21 12V7H5a2 2 0 0 1 0-4h14v4M3 5v14a2 2 0 0 0 2 2h16v-5M16 12h4v4h-4z',
            'cloud-sun': 'M12 2v2M4.22 4.22l1.42 1.42M1 12h2M21 12h2M18.36 5.64l1.42-1.42M22 17a3 3 0 0 1-3 3H7a5 5 0 0 1-1-9.9M12 14a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z',
            'terminal': 'm4 17 6-6-6-6M12 19h8',
            'bell': 'M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9ZM10.3 21a1.94 1.94 0 0 0 3.4 0',
            'layers': 'm12 3-10 5 10 5 10-5-10-5ZM2 17l10 5 10-5M2 12l10 5 10-5'
        };

        document.addEventListener("DOMContentLoaded", function() {
            if (!localStorage.getItem('ios_studio_db')) {
                localStorage.setItem('ios_studio_db', JSON.stringify([]));
            }
            updatePreview();
            evalSmartButtonState();
        });

        function searchAppStore() {
            const query = document.getElementById('appSearchInput').value.toLowerCase().trim();
            if (!query) return;

            if (appStoreDatabase[query]) {
                const app = appStoreDatabase[query];
                document.getElementById('assetLabel').value = app.label;
                document.getElementById('bgColor').value = app.bg;
                document.getElementById('iconColor').value = app.iconColor;
                document.getElementById('iconSelect').value = app.icon;
                updatePreview();
            } else {
                // Inteligentní fallback generátor barvy
                document.getElementById('assetLabel').value = query.charAt(0).toUpperCase() + query.slice(1);
                document.getElementById('bgColor').value = '#0284c7';
                document.getElementById('iconColor').value = '#ffffff';
                updatePreview();
            }
        }

        function switchTab(target) {
            document.getElementById('tab-maker').classList.toggle('hidden', target !== 'maker');
            document.getElementById('tab-community').classList.toggle('hidden', target !== 'community');
            
            document.getElementById('btn-maker').className = target === 'maker' ? "px-2 py-0.5 rounded bg-blue-600 font-bold text-[8px] text-white cursor-pointer" : "px-2 py-0.5 rounded font-bold text-[8px] text-slate-400 hover:text-white cursor-pointer";
            document.getElementById('btn-community').className = target === 'community' ? "px-2 py-0.5 rounded bg-blue-600 font-bold text-[8px] text-white cursor-pointer" : "px-2 py-0.5 rounded font-bold text-[8px] text-slate-400 hover:text-white cursor-pointer";

            if (target === 'community') renderRegistryGrid();
            else evalSmartButtonState();
        }

        function setAssetType(type) {
            currentAssetType = type;
            ['icon', 'widget-s', 'widget-m'].forEach(t => {
                document.getElementById(`type-${t}`).className = t === type ? "py-0.5 rounded border border-blue-500 bg-blue-500/10 text-[8px] font-bold text-white cursor-pointer" : "py-0.5 rounded border border-white/10 bg-slate-950/40 text-[8px] font-bold text-slate-400 hover:text-white cursor-pointer";
            });

            const container = document.getElementById('preview-container');
            const element = document.getElementById('ios-element');
            const label = document.getElementById('element-label');

            if (type === 'icon') {
                container.className = "col-span-1 row-span-1 flex flex-col items-center justify-start";
                element.className = "w-8 h-8 rounded-lg shadow-lg flex flex-col items-center justify-center relative overflow-hidden";
                label.classList.remove('hidden');
            } else if (type === 'widget-s') {
                container.className = "col-span-2 row-span-2 flex flex-col items-center justify-start";
                element.className = "w-[72px] h-[72px] rounded-[14px] shadow-lg flex flex-col items-center justify-center relative overflow-hidden";
                label.classList.add('hidden');
            } else if (type === 'widget-m') {
                container.className = "col-span-4 row-span-2 flex flex-col items-center justify-start";
                element.className = "w-[152px] h-[72px] rounded-[14px] shadow-lg flex flex-col items-center justify-center relative overflow-hidden";
                label.classList.add('hidden');
            }
            updatePreview();
        }

        function updatePreview() {
            const bg = document.getElementById('bgColor').value;
            const fg = document.getElementById('iconColor').value;
            const icon = document.getElementById('iconSelect').value;
            const text = document.getElementById('elementText').value;

            document.getElementById('element-label').innerText = document.getElementById('assetLabel').value || "App";
            
            const element = document.getElementById('ios-element');
            const pIcon = document.getElementById('preview-icon');
            const pText = document.getElementById('preview-text');

            element.style.backgroundColor = bg;
            pIcon.style.color = fg;
            pIcon.setAttribute('data-lucide', icon);

            if (currentAssetType === 'icon') {
                pIcon.className = "w-4 h-4";
                pText.classList.add('hidden');
            } else {
                pIcon.className = "w-4 h-4";
                if(text.trim()) {
                    pText.innerText = text;
                    pText.style.color = fg;
                    pText.classList.remove('hidden');
                } else {
                    pText.classList.add('hidden');
                }
            }
            lucide.createIcons();
        }

        function evalSmartButtonState() {
            const db = JSON.parse(localStorage.getItem('ios_studio_db')) || [];
            document.getElementById('global-counter').innerText = db.length;
            
            const btn = document.getElementById('smart-action-btn');
            const icon = document.getElementById('smart-btn-icon');
            const text = document.getElementById('smart-btn-text');

            if (db.length >= 2) {
                btn.className = "w-full bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-bold py-1.5 rounded text-[9px] flex items-center justify-center gap-1 shadow-md cursor-pointer";
                icon.setAttribute('data-lucide', 'archive');
                text.innerText = `Stáhnout kompletní ZIP balíček (${db.length} ikon)`;
            } else {
                btn.className = "w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold py-1.5 rounded text-[9px] flex items-center justify-center gap-1 shadow-md cursor-pointer";
                icon.setAttribute('data-lucide', 'download');
                text.innerText = "Stáhnout aktuální ikonu (.PNG)";
            }
            lucide.createIcons();
        }

        function executeSmartAction() {
            const db = JSON.parse(localStorage.getItem('ios_studio_db')) || [];
            if (db.length >= 2) downloadZipArchive(db);
            else downloadSingleAsset();
        }

        // Nativní Canvas Generátor (1024px HD) - Nepotřebuje html2canvas, funguje 100% vždy
        function drawAssetToCanvas(item, callback) {
            const canvas = document.getElementById('exportCanvas');
            const ctx = canvas.getContext('2d');
            
            const w = item.type === 'widget-m' ? 2112 : 1024;
            const h = 1024;
            canvas.width = w;
            canvas.height = h;

            // Pozadí s iOS zaoblením rohů
            ctx.fillStyle = item.bgColor;
            const radius = 200;
            ctx.beginPath();
            ctx.roundRect(0, 0, w, h, radius);
            ctx.fill();

            // Vykreslení ikony z vektorové mapy
            ctx.strokeStyle = item.iconColor;
            ctx.lineWidth = 32;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            ctx.save();
            // Centrovaná škála
            if (item.type === 'icon') {
                ctx.translate(w/2 - 256, h/2 - 256);
                ctx.scale(21.33, 21.33); // 24px vektor -> 512px ikona
            } else {
                ctx.translate(w/2 - 180, h/2 - 240);
                ctx.scale(15, 15);
            }

            const pathStr = canvasPathMap[item.icon] || canvasPathMap['heart'];
            const p = new Path2D(pathStr);
            ctx.stroke(p);
            ctx.restore();

            // Pokud jde o widget s doprovodným textem
            if (item.type !== 'icon' && item.txt) {
                ctx.fillStyle = item.iconColor;
                ctx.font = "bold 75px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(item.txt.toUpperCase(), w / 2, h / 2 + 260);
            }

            callback(canvas.toDataURL('image/png'));
        }

        function downloadSingleAsset() {
            const currentItem = {
                name: document.getElementById('assetLabel').value || 'app_icon',
                type: currentAssetType,
                bgColor: document.getElementById('bgColor').value,
                iconColor: document.getElementById('iconColor').value,
                icon: document.getElementById('iconSelect').value,
                txt: document.getElementById('elementText').value
            };

            drawAssetToCanvas(currentItem, function(dataUrl) {
                const link = document.createElement('a');
                link.download = `${currentItem.name.toLowerCase().replace(/\s+/g, '_')}.png`;
                link.href = dataUrl;
                link.click();
            });
        }

        function saveToRegistry() {
            const db = JSON.parse(localStorage.getItem('ios_studio_db')) || [];
            const record = {
                id: Date.now(),
                name: document.getElementById('assetLabel').value || 'Nepojmenovaná ikona',
                type: currentAssetType,
                bgColor: document.getElementById('bgColor').value,
                iconColor: document.getElementById('iconColor').value,
                icon: document.getElementById('iconSelect').value,
                txt: currentAssetType !== 'icon' ? document.getElementById('elementText').value : ""
            };

            db.unshift(record);
            localStorage.setItem('ios_studio_db', JSON.stringify(db));
            
            // Vizuální odezva tlačítka
            const btn = document.getElementById('btn-save');
            const origText = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="check-circle" class="w-2.5 h-2.5 text-emerald-400"></i> Uloženo!`;
            lucide.createIcons();
            setTimeout(() => { btn.innerHTML = origText; lucide.createIcons(); }, 1000);

            evalSmartButtonState();
        }

        function renderRegistryGrid() {
            const grid = document.getElementById('community-grid');
            const db = JSON.parse(localStorage.getItem('ios_studio_db')) || [];
            grid.innerHTML = "";

            if (db.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-6 text-center text-slate-600 font-mono text-[8px]">ŽÁDNÉ ULOŽENÉ IKONY V PROHLÍŽEČI</div>`;
                return;
            }

            db.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-slate-900/60 border border-white/5 rounded-lg p-2 flex flex-col items-center justify-between text-center shadow-md";
                card.innerHTML = `
                    <div class="w-6 h-6 rounded flex items-center justify-center shadow" style="background-color: ${item.bgColor}">
                        <i data-lucide="${item.icon}" class="w-3.5 h-3.5" style="color: ${item.iconColor}"></i>
                    </div>
                    <p class="font-bold text-[8px] text-slate-300 truncate w-full mt-1.5">${item.name}</p>
                    <div class="grid grid-cols-2 gap-1 w-full mt-2">
                        <button onclick="loadAssetToEditor(${item.id})" class="py-0.5 bg-blue-600/20 hover:bg-blue-600 text-blue-300 hover:text-white rounded text-[7px] font-bold cursor-pointer transition-all">Načíst</button>
                        <button onclick="deleteAsset(${item.id})" class="py-0.5 bg-rose-950/40 hover:bg-rose-600 text-rose-400 hover:text-white rounded text-[7px] cursor-pointer transition-all">Smazat</button>
                    </div>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
            document.getElementById('global-counter').innerText = db.length;
        }

        function loadAssetToEditor(id) {
            const db = JSON.parse(localStorage.getItem('ios_studio_db')) || [];
            const item = db.find(x => x.id === id);
            if(!item) return;

            document.getElementById('assetLabel').value = item.name;
            document.getElementById('bgColor').value = item.bgColor;
            document.getElementById('iconColor').value = item.iconColor;
            document.getElementById('iconSelect').value = item.icon;
            document.getElementById('elementText').value = item.txt || "";

            setAssetType(item.type);
            switchTab('maker');
        }

        function deleteAsset(id) {
            let db = JSON.parse(localStorage.getItem('ios_studio_db')) || [];
            db = db.filter(x => x.id !== id);
            localStorage.setItem('ios_studio_db', JSON.stringify(db));
            renderRegistryGrid();
        }

        function clearRegistryFully() {
            if(confirm("Opravdu smazat celou lokální databázi ikon?")) {
                localStorage.setItem('ios_studio_db', JSON.stringify([]));
                renderRegistryGrid();
            }
        }

        function downloadZipArchive(db) {
            const zip = new JSZip();
            let loadedCount = 0;

            db.forEach((item, index) => {
                drawAssetToCanvas(item, function(dataUrl) {
                    const base64Data = dataUrl.split(',')[1];
                    const filename = `${item.name.toLowerCase().replace(/[^a-z0-9]/gi, '_')}_${index + 1}.png`;
                    zip.file(filename, base64Data, { base64: true });
                    
                    loadedCount++;
                    if(loadedCount === db.length) {
                        zip.generateAsync({ type: "blob" }).then(function(content) {
                            const link = document.createElement('a');
                            link.download = `ios_pack_${Date.now()}.zip`;
                            link.href = URL.createObjectURL(content);
                            link.click();
                        });
                    }
                });
            });
        }
    </script>
</body>
</html>
